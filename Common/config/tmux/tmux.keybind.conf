# Replace prefix key from ctrl-b to ctrl-g
set-option -g prefix C-g
bind-key C-g send-prefix

# Use vi style-style key binding in copy mode
setw -g mode-keys vi
 
bind-key -N "Select the tiled layout so that I can see all the panes displayed at once" = select-layout tiled
bind-key -N "Split pane horizontaly" % split-window -h -c "#{pane_current_path}"
bind-key -N "Split pane verticaly" '"' split-window -c "#{pane_current_path}"
bind-key -N "Reload configurations" R source-file ~/.config/tmux/tmux.conf \; display "reloaded!"
bind-key -N "Open memo.md in a new session" m new-session -A -c "~/Documents/memo" -f no-detach-on-destroy -n memo -s memo "nvim memo.md"
bind-key -N "Swap focused pane and the next pane" h swap-pane -dDZ \; select-pane -t 1
bind-key -N "Choose-tree with name ordered" s choose-tree -sZ -O name

